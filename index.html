<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sang Hyeok's Homepage</title>
    <style>
        body {
            display: flex;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        nav {
            width: 200px;
            background-color: #f4f4f4;
            padding: 15px;
            height: 100vh;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
        }
        nav ul li {
            margin-bottom: 10px;
        }
        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }
        nav ul li a:hover {
            color: #007BFF;
        }
        main {
            padding: 20px;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#" onclick="loadContent('Home')">Home</a></li>
            <li><a href="#" onclick="loadContent('Research Interests')">Research Interests</a></li>
            <li><a href="#" onclick="loadContent('Recent Works')">Recent Works</a></li>
            <li><a href="#" onclick="loadContent('Contact')">Contact</a></li>
        </ul>
    </nav>
    
    <main id="main-content">
        <h1>Welcome to the Homepage of Sang Hyeok Im (임상혁)</h1>
        <p>Hi! I am Sang Hyeok Im, a graduate student studying astronomy in Seoul National University.</p>
    </main>

    <script>
        function loadContent(section) {
            var content = document.getElementById('main-content');
            
            if (section === 'Home') {
                content.innerHTML = `
                    <h1>Welcome to the Homepage of Sang Hyeok Im (임상혁)</h1>
                    <p>Hi! I am Sang Hyeok Im, a graduate student studying astronomy in Seoul National University.</p>
                `;
            } else if (section === 'Research Interests') {
                content.innerHTML = `
                    <h1>Research Interests</h1>
                    <p>Large-scale structures of the Universe</p>
                `;
            } else if (section === 'Recent Works') {
                content.innerHTML = `
                    <h1>Recent Works</h1>
                    <ul>
                        <h2>Reffereed Journal Article</h2>
                        <h3 class="">First Author</h3>
                        <ul>
                            <li>Testing Lyα Emitters and Lyman-break Galaxies as Tracers of Large-scale Structures at High Redshifts <br> 2024, ApJ, 972, 196 (<a href="https://ui.adsabs.harvard.edu/abs/2024ApJ...972..196I/abstract" target="_blank">link</a>)
</li>
                        </ul>

                        <h3 class="">Co-Author</h3>
                        <ul>
                            <li>Will be updated ...</li>
                        </ul>
                        
                    </ul>
                    
                `;
            } else if (section === 'Contact') {
                content.innerHTML = `
                    <h1>Contact</h1>
                    <p>Feel free email me!</p>
                `;
            }
        }
    </script>
</body>
</html>
